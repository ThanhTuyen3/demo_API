name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor
        run: |
          postman collection run "59055577-df2be595-79e7-46a5-a8c3-783f3dc65457"
